<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>YT Vision Explainer Settings</title>

    <!-- Local compiled Tailwind -->
    <link
        rel="stylesheet"
        href="../tailwind/output.css"
    />

</head>

<body
    class="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center px-4"
>

    <main
        class="w-full max-w-md rounded-2xl border border-zinc-800 bg-zinc-900 shadow-2xl p-8"
    >

        <!-- Header -->
        <header class="mb-8 text-center">

            <div
                class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-600/20 border border-blue-500/30"
            >
                <span class="text-2xl">🧠</span>
            </div>

            <h1 class="text-2xl font-bold tracking-tight">
                YT Vision Explainer
            </h1>

            <p class="mt-2 text-sm text-zinc-400">
                Configure your Gemini AI connection
            </p>

        </header>

        <!-- Form -->
        <section class="space-y-6">

            <!-- API Key -->
            <div>

                <div class="flex items-center justify-between mb-2">

                    <label
                        for="apiKey"
                        class="text-sm font-medium text-zinc-300"
                    >
                        Gemini API Key
                    </label>

                    <button
                        id="toggleVisibility"
                        type="button"
                        class="text-xs text-blue-400 hover:text-blue-300 transition-colors"
                    >
                        Show
                    </button>

                </div>

                <div class="relative">

                    <input
                        id="apiKey"
                        type="password"
                        placeholder="AIzaSy..."
                        autocomplete="off"
                        spellcheck="false"
                        class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-sm text-white placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                    />

                </div>

                <div class="mt-3 flex items-start gap-2 text-xs text-zinc-500">

                    <span>ℹ️</span>

                    <p>
                        Your API key is stored locally in your browser.
                        It is never sent anywhere except directly to Google Gemini.
                    </p>

                </div>

                <a
                    href="https://aistudio.google.com/app/apikey"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="mt-3 inline-flex text-sm text-blue-400 hover:text-blue-300 hover:underline"
                >
                    Open Google AI Studio →
                </a>

            </div>

            <!-- Model Selection -->
            <div>

                <label
                    for="modelSelect"
                    class="mb-2 block text-sm font-medium text-zinc-300"
                >
                    Gemini Model
                </label>

                <select
                    id="modelSelect"
                    class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                    <option value="gemini-2.5-flash">
                        Gemini 2.5 Flash (Fast)
                    </option>

                    <option value="gemini-2.5-pro">
                        Gemini 2.5 Pro (Smarter)
                    </option>
                </select>

            </div>

            <!-- Save Button -->
            <button
                id="saveBtn"
                class="flex w-full items-center justify-center gap-2 rounded-xl bg-blue-600 px-4 py-3 font-semibold text-white transition-all hover:bg-blue-500 active:scale-[0.98]"
            >

                <span id="saveBtnText">
                    Save Settings
                </span>

                <svg
                    id="loadingSpinner"
                    class="hidden h-5 w-5 animate-spin"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                >
                    <circle
                        class="opacity-25"
                        cx="12"
                        cy="12"
                        r="10"
                        stroke="currentColor"
                        stroke-width="4"
                    ></circle>

                    <path
                        class="opacity-75"
                        fill="currentColor"
                        d="M4 12a8 8 0 018-8v8H4z"
                    ></path>
                </svg>

            </button>

            <!-- Status -->
            <div
                id="statusMessage"
                class="hidden rounded-xl border px-4 py-3 text-sm transition-all"
            ></div>

        </section>

        <!-- Footer -->
        <footer
            class="mt-8 border-t border-zinc-800 pt-5 text-center text-xs text-zinc-500"
        >
            YT Vision Explainer v1.0.0
        </footer>

    </main>

    <!-- Shared scripts loaded sequentially for Manifest V3 compatibility -->
    <script src="../lib/constants.js"></script>
    <script src="../lib/storage.js"></script>
    <script src="./options.js"></script>

</body>

</html>
